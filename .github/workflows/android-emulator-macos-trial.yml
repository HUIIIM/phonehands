# SPDX-License-Identifier: MIT
#
# TRIAL ONLY — macos-runner validation for gate-4a Android.
# Board-approved trial (2026-10-10): verifies the Android emulator boots with
# hardware acceleration on a macOS hosted runner after the Linux KVM path
# failed (udev 0666 workaround ineffective on ubuntu-latest).
#
# Cost: ~$0.08/min. Expected 25-45 min per run => ~$2-4 per trial.
# This workflow is workflow_dispatch ONLY. It does NOT replace
# android-emulator.yml. Full migration only after this trial goes green.

name: "trial · Android Emulator on macOS (gate-4a validation)"

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  android-emulator-macos:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Boot emulator + run protocol chain + real adb smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none
          script: bash scripts/ci/android-emulator-smoke.sh
