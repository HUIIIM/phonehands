# SPDX-License-Identifier: BUSL-1.1
#
# Gate 4a (Android): protocol chain + real-device smoke on an Android Emulator.
#
# What this proves ($0, no hardware):
#   1. @phonehands/android-backend full unit+e2e suite on a real Android-x86
#      kernel (the tests use MockAndroidDevice, but over REAL TCP/WebSocket
#      sockets — no in-process fakes).
#   2. android-wireless-demo assertions (relay connect -> frame -> tap ->
#      screenshot -> observe -> launch) on the runner.
#   3. emulator-smoke.ts: a REAL Android OS driven through the EXACT adb
#      command shapes our wireless-adb fallback documents (tapCommand /
#      screenshotCommand builders) — real tap executed, real PNG screencap
#      magic verified. This is the closest CI gets to a device without one.
#
# Trigger policy: manual + weekly only (same cost discipline as the iOS
# workflow; the emulator boot is the expensive part, ~3-5 min).
#
# Honest scope: proves adb reachability + command shapes on a real Android
# OS. The helper APK path (AccessibilityService/MediaProjection, the
# wireless-first design) still needs gate 4b physical devices. Never cite
# this workflow as "real-device testing passed".
#
# Secrets: none required.

name: "gate-4a · Android Emulator — protocol chain + adb smoke"

on:
  workflow_dispatch: {}
  schedule:
    # Weekly, Monday 09:00 UTC (05:00 ET) — cheap, off-peak.
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Install emulator host libs
        # qemu-system-x86_64 dynamically links libpulse even with -no-audio;
        # ubuntu-latest runners no longer ship it -> "error while loading
        # shared libraries: libpulse.so.0" before the emulator even starts.
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq libpulse0

      - name: Enable KVM for the emulator
        # Without KVM the x86_64 emulator falls back to full software
        # emulation and never finishes booting inside the timeout
        # ("ProbeKVM: This user doesn't have permissions to use KVM").
        # Standard workaround from reactivecircus/android-emulator-runner README.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + run protocol chain + real adb smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # API 30 + default target: boots in ~1-2 min on hosted runners.
          # (API 34 google_apis never finished booting within the action's
          # internal timeout — "Timeout waiting for emulator to boot".)
          # Nothing in the test chain needs a newer API: the backend suite
          # uses MockAndroidDevice over real TCP/WS, and emulator-smoke.ts
          # only needs `input tap` + `screencap -p`.
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot -no-audio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb wait-for-device
            SERIAL="$(adb get-serialno)"
            echo "Emulator serial: ${SERIAL}"
            echo "--- 1/3 android-backend suite (real TCP/WS, mock phone) ---"
            npm test --workspace=@phonehands/android-backend
            echo "--- 2/3 wireless-demo assertions ---"
            PHONEHANDS_RELAY_URL="ws://127.0.0.1:8099/phonehands-android" \
              node examples/android-wireless-demo/demo.ts
            echo "--- 3/3 real adb smoke (real Android OS, our cmd builders) ---"
            ANDROID_SERIAL="${SERIAL}" node examples/android-wireless-demo/emulator-smoke.ts
# retrigger 2026-10-10T02:59:58Z
