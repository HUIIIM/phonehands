# Per-push / per-PR gate: install from the lockfile, typecheck/build every
# workspace, run every mock test suite (incl. the read-only build), audit deps.
# Device/simulator chains stay in the weekly workflows.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (tsc, all workspaces)
        run: npm run build
      - name: Generated build flags must match the committed file
        run: git diff --exit-code packages/core/src/__buildFlags.ts
      - name: Tests (mock suites)
        run: npm test
      - name: Read-only build tests
        run: npm run test:readonly --workspace @phonehands/core
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

  android-helper:
    # Compiles the on-phone helper APK. GitHub's ubuntu image ships the
    # Android SDK (platform 34 + build-tools) with licences accepted.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "8.14.3"
      - name: Assemble debug APK
        run: gradle -p packages/android-helper :app:assembleDebug --no-daemon
