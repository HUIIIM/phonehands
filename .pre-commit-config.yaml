# SPDX-License-Identifier: MIT
# Mirrors .github/workflows/ci.yml locally:  pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: lint
        name: biome lint (npm run lint)
        entry: npm run lint
        language: system
        pass_filenames: false
        files: \.(ts|cjs)$
      - id: build
        name: tsc build (npm run build)
        entry: npm run build
        language: system
        pass_filenames: false
        files: \.ts$
      - id: test
        name: mock test suites (npm test)
        entry: npm test
        language: system
        pass_filenames: false
        stages: [pre-push]
